name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell syntax
        run: |
          bash -n toolkit.sh
          bash -n installer.sh
          bash -n acherongen.sh
          bash -n listener_gen.sh
        working-directory: ${{ github.workspace }}

      - name: Run ShellCheck
        run: |
          shellcheck toolkit.sh
          shellcheck installer.sh
          shellcheck acherongen.sh
          shellcheck listener_gen.sh
        working-directory: ${{ github.workspace }}

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for dangerous patterns
        run: |
          # Check for hardcoded paths
          if grep -r "/home/giovi" --include="*.sh" --include="*.rb" . | grep -v ".git"; then
            echo "❌ Found hardcoded paths"
            exit 1
          fi
          echo "✅ No hardcoded paths found"

      - name: Validate Metasploit module syntax
        run: |
          ruby -c bypassuac_method59.rb
        working-directory: ${{ github.workspace }}